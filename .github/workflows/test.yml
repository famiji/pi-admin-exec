name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The wrapper is plain /bin/sh and the suite never touches a dialog, so
      # it runs on Linux even though the elevation backend is macOS-only.
      - run: npm test
